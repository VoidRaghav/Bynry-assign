name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        default: staging

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}
  TEST_RUN_ID: ${{ github.run_id }}
  BUILD_NAME: workflowpro-${{ github.ref_name }}-${{ github.run_number }}
  COMPANY1_ADMIN_PASSWORD: ${{ secrets.COMPANY1_ADMIN_PASSWORD }}
  COMPANY1_ADMIN_TOTP: ${{ secrets.COMPANY1_ADMIN_TOTP }}
  COMPANY1_MANAGER_PASSWORD: ${{ secrets.COMPANY1_MANAGER_PASSWORD }}
  COMPANY1_EMPLOYEE_PASSWORD: ${{ secrets.COMPANY1_EMPLOYEE_PASSWORD }}
  COMPANY2_ADMIN_PASSWORD: ${{ secrets.COMPANY2_ADMIN_PASSWORD }}
  COMPANY2_EMPLOYEE_PASSWORD: ${{ secrets.COMPANY2_EMPLOYEE_PASSWORD }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api -n 8 --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results
          path: allure-results

  web:
    runs-on: ubuntu-latest
    needs: api
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: pull request runs the browser smoke, everything else runs the full suite
        run: |
          MARKER=$([ "${{ github.event_name }}" = "pull_request" ] && echo "smoke and not api" || echo "web or integration")
          pytest -m "$MARKER and not mobile" --browser=${{ matrix.browser }} -n 4 \
            --reruns 1 --reruns-delay 3 --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-${{ matrix.browser }}
          path: |
            allure-results
            artifacts

  mobile:
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m mobile --device-suite=nightly -n 3 --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-results
          path: allure-results
