[pytest]
testpaths = framework/tests part1_flaky_login
pythonpath = framework
addopts =
    -ra
    --strict-markers
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=artifacts
markers =
    api: backend only checks, no browser needed
    web: desktop browser checks
    mobile: runs on a real device or an emulated handset viewport
    integration: crosses the API and UI layers
    security: tenant isolation and permission boundaries
    smoke: the short suite that gates every pull request
